name: Release

# Builds signed-less installers for macOS, Windows, and Linux and attaches them
# to a GitHub Release. Triggered automatically on any `v*` tag, or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux / Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build release binaries + create/update GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevDock ${{ github.ref_name }}"
          releaseBody: |
            ## DevDock ${{ github.ref_name }}

            Your local development command center. See the assets below to
            download and install this version for your platform.

            - **macOS**: `DevDock_*.dmg`
            - **Windows**: `DevDock_*.msi` / `DevDock_*.exe`
            - **Linux**: `DevDock_*.AppImage` / `DevDock_*.deb`

            > Note: binaries are not code-signed. On macOS, right-click → Open,
            or run `xattr -dr com.apple.quarantine DevDock.app` the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}